name: Deploy infrastructure

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    environment: prod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Initialize Terraform
        run: terraform -chdir=infra/terraform init

      - name: Create ECR repository
        run: |
          terraform -chdir=infra/terraform apply \
            -auto-approve \
            -target=aws_ecr_repository.app \
            -var="image_tag=${{ github.sha }}" \
            -var="vpc_id=${{ secrets.AWS_VPC_ID }}" \
            -var='public_subnet_ids=${{ secrets.AWS_PUBLIC_SUBNET_IDS }}'

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check if image already exists
        id: image
        env:
          REPOSITORY: expense-tracker-prod
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region ap-northeast-2 > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE_TAG already exists in ECR. Skipping push."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE_TAG does not exist. It will be built and pushed."
          fi

      - name: Build and push Docker image
        if: steps.image.outputs.exists != 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: expense-tracker-prod
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"

      - name: Deploy application infrastructure
        run: |
          terraform -chdir=infra/terraform apply \
            -auto-approve \
            -var="image_tag=${{ github.sha }}" \
            -var="vpc_id=${{ secrets.AWS_VPC_ID }}" \
            -var='public_subnet_ids=${{ secrets.AWS_PUBLIC_SUBNET_IDS }}'
