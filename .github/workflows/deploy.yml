name: Deploy infrastructure
on:
  push: { branches: [main] }
permissions: { contents: read, id-token: write }
jobs:
  apply:
    environment: prod
    runs-on: ubuntu-latest
    env:
      TF_VAR_environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - run: terraform -chdir=infra/terraform init
      - run: terraform -chdir=infra/terraform apply -auto-approve -target=aws_ecr_repository.app -var="image_tag=${{ github.sha }}" -var="vpc_id=${{ secrets.AWS_VPC_ID }}" -var='public_subnet_ids=${{ secrets.AWS_PUBLIC_SUBNET_IDS }}'
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - run: docker build --tag "$REGISTRY/$REPOSITORY:${{ github.sha }}" . && docker push "$REGISTRY/$REPOSITORY:${{ github.sha }}"
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: expense-tracker-prod
      - run: terraform -chdir=infra/terraform apply -auto-approve -var="image_tag=${{ github.sha }}" -var="vpc_id=${{ secrets.AWS_VPC_ID }}" -var='public_subnet_ids=${{ secrets.AWS_PUBLIC_SUBNET_IDS }}'
